name: X profile batch transfer

on:
  push:
    branches:
      - x-video-transfer-test
    paths:
      - .github/workflows/x-video-transfer-test.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out transfer branch
        uses: actions/checkout@v4
        with:
          ref: x-video-transfer-test

      - name: Install gallery-dl
        run: |
          python -m pip install --upgrade pip gallery-dl
          gallery-dl --version

      - name: Download recent X profile media
        shell: bash
        run: |
          set -euo pipefail
          rm -rf downloads
          mkdir -p downloads
          cat > gallery-dl.conf <<'JSON'
          {
            "extractor": {
              "base-directory": "downloads",
              "twitter": {
                "include": ["media"],
                "retweets": false,
                "replies": false,
                "quoted": false,
                "pinned": false,
                "videos": true,
                "logout": true,
                "ratelimit": "wait:60",
                "sleep-request": "1.0-2.5",
                "filename": "{tweet_id}_{num}.{extension}",
                "directory": ["ylslnm"]
              }
            }
          }
          JSON
          gallery-dl --no-input --config gallery-dl.conf --post-range 1-20 --write-metadata "https://x.com/ylslnm/media"
          COUNT=$(find downloads -type f ! -name '*.json' | wc -l | tr -d ' ')
          test "$COUNT" -gt 0
          find downloads -type f -printf '%P\t%s bytes\n' | sort > batch-manifest.txt
          echo "media_files=$COUNT" >> "$GITHUB_ENV"
          echo "total_bytes=$(find downloads -type f ! -name '*.json' -printf '%s\n' | awk '{s+=$1} END{print s+0}')" >> "$GITHUB_ENV"
          cat batch-manifest.txt

      - name: Upload batch artifact
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: x-profile-ylslnm-latest20
          path: |
            downloads/
            batch-manifest.txt
          if-no-files-found: error
          retention-days: 1

      - name: Publish batch metadata
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          set -euo pipefail
          printf '{\n  "run_id": %s,\n  "artifact_id": %s,\n  "artifact_url": "%s",\n  "source_profile": "https://x.com/ylslnm",\n  "post_range": "1-20",\n  "media_files": %s,\n  "total_media_bytes": %s,\n  "artifact_name": "x-profile-ylslnm-latest20"\n}\n' \
            '${{ github.run_id }}' "$ARTIFACT_ID" "$ARTIFACT_URL" "$media_files" "$total_bytes" > x-transfer-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add x-transfer-result.json
          git commit -m 'Record X profile batch transfer metadata'
          git push origin HEAD:x-video-transfer-test
