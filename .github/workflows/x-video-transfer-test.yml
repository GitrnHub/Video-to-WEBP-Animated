name: X profile batch transfer

on:
  push:
    branches:
      - x-video-transfer-test
    paths:
      - .github/workflows/x-video-transfer-test.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out transfer branch
        uses: actions/checkout@v4
        with:
          ref: x-video-transfer-test

      - name: Download public X profile media from syndication timeline
        id: download
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rm -rf downloads
          mkdir -p downloads/ylslnm

          cat > fetch_syndication.py <<'PY'
          import json, re, sys, os
          from pathlib import Path
          from urllib.parse import urlparse
          import requests

          HANDLE = 'ylslnm'
          PROFILE = f'https://syndication.twitter.com/srv/timeline-profile/screen-name/{HANDLE}'
          OUT = Path('downloads') / HANDLE
          OUT.mkdir(parents=True, exist_ok=True)
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/136.0 Safari/537.36'
          s = requests.Session()
          s.headers.update({'User-Agent': UA, 'Accept': '*/*'})

          r = s.get(PROFILE, timeout=60)
          Path('syndication-status.txt').write_text(f'HTTP {r.status_code}\nbytes={len(r.content)}\n', encoding='utf-8')
          r.raise_for_status()
          html = r.text
          m = re.search(r'<script[^>]+id=["\']__NEXT_DATA__["\'][^>]*>(.*?)</script>', html, re.S)
          if not m:
              raise RuntimeError('__NEXT_DATA__ not found')
          data = json.loads(m.group(1))
          page = data.get('props', {}).get('pageProps', {})
          timeline = page.get('timeline') or {}
          entries = timeline.get('entries') or []
          context = page.get('contextProvider') or {}
          summary = {
              'hasResults': context.get('hasResults'),
              'entry_count': len(entries),
              'latest_tweet_id': page.get('latest_tweet_id'),
          }
          Path('syndication-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')

          downloads = []
          seen_urls = set()

          def add_url(tweet_id, num, url, kind, created_at=None):
              if not url or url in seen_urls:
                  return
              seen_urls.add(url)
              clean = url.split('?')[0]
              ext = os.path.splitext(urlparse(clean).path)[1].lower()
              if not ext or len(ext) > 5:
                  ext = '.mp4' if kind in ('video', 'animated_gif') else '.jpg'
              name = f'{tweet_id}_{num}{ext}'
              path = OUT / name
              with s.get(url, stream=True, timeout=120) as rr:
                  rr.raise_for_status()
                  with path.open('wb') as f:
                      for chunk in rr.iter_content(1024 * 1024):
                          if chunk:
                              f.write(chunk)
              downloads.append({
                  'tweet_id': str(tweet_id),
                  'kind': kind,
                  'created_at': created_at,
                  'file': str(path),
                  'size': path.stat().st_size,
                  'source_url': url,
                  'tweet_url': f'https://x.com/{HANDLE}/status/{tweet_id}',
              })

          tweet_count = 0
          for entry in entries:
              if entry.get('type') != 'tweet':
                  continue
              tweet = (entry.get('content') or {}).get('tweet') or {}
              tid = str(tweet.get('id_str') or tweet.get('id') or '')
              if not tid:
                  continue
              tweet_count += 1
              if tweet_count > 20:
                  break
              created = tweet.get('created_at')
              num = 0
              details = tweet.get('mediaDetails') or []
              for media in details:
                  kind = media.get('type')
                  if kind == 'photo':
                      url = media.get('media_url_https') or media.get('url')
                      if url and 'name=' not in url:
                          url += '?name=orig'
                      num += 1
                      add_url(tid, num, url, 'photo', created)
                  elif kind in ('video', 'animated_gif'):
                      variants = ((media.get('video_info') or {}).get('variants') or [])
                      mp4 = [v for v in variants if v.get('content_type') == 'video/mp4' and v.get('url')]
                      if mp4:
                          best = max(mp4, key=lambda v: int(v.get('bitrate') or 0))
                          num += 1
                          add_url(tid, num, best['url'], kind, created)

              if not details:
                  video = tweet.get('video') or {}
                  variants = video.get('variants') or []
                  mp4 = [v for v in variants if (v.get('type') == 'video/mp4' or str(v.get('src','')).split('?')[0].endswith('.mp4')) and v.get('src')]
                  if mp4:
                      best = max(mp4, key=lambda v: len(v.get('src','')))
                      num += 1
                      add_url(tid, num, best['src'], 'video', created)
                  for photo in tweet.get('photos') or []:
                      url = photo.get('url')
                      if url:
                          num += 1
                          add_url(tid, num, url, 'photo', created)

          Path('tweet-manifest.json').write_text(json.dumps(downloads, ensure_ascii=False, indent=2), encoding='utf-8')
          with Path('batch-manifest.txt').open('w', encoding='utf-8') as f:
              for item in downloads:
                  f.write(f"{item['file']}\t{item['size']} bytes\t{item['tweet_url']}\n")
          print(json.dumps({'tweets_scanned': tweet_count, 'media_files': len(downloads), 'total_bytes': sum(x['size'] for x in downloads)}, ensure_ascii=False))
          if not downloads:
              sys.exit(31)
          PY

          python fetch_syndication.py > syndication-fetch.log 2>&1
          RC=$?
          COUNT=$(find downloads -type f | wc -l | tr -d ' ')
          TOTAL=$(find downloads -type f -printf '%s\n' | awk '{s+=$1} END{print s+0}')
          echo "download_rc=$RC" >> "$GITHUB_ENV"
          echo "media_files=$COUNT" >> "$GITHUB_ENV"
          echo "total_bytes=$TOTAL" >> "$GITHUB_ENV"
          cat syndication-status.txt 2>/dev/null || true
          cat syndication-summary.json 2>/dev/null || true
          cat syndication-fetch.log 2>/dev/null || true
          cat batch-manifest.txt 2>/dev/null || true
          exit "$RC"

      - name: Upload batch artifact and diagnostics
        id: artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x-profile-ylslnm-syndication
          path: |
            downloads/
            batch-manifest.txt
            tweet-manifest.json
            syndication-status.txt
            syndication-summary.json
            syndication-fetch.log
            fetch_syndication.py
          if-no-files-found: error
          retention-days: 1

      - name: Publish batch metadata
        if: always()
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          DL_OUTCOME: ${{ steps.download.outcome }}
        run: |
          set -euo pipefail
          printf '{\n  "run_id": %s,\n  "artifact_id": %s,\n  "artifact_url": "%s",\n  "source_profile": "https://x.com/ylslnm",\n  "method": "syndication-profile",\n  "download_outcome": "%s",\n  "download_exit_code": %s,\n  "media_files": %s,\n  "total_media_bytes": %s,\n  "artifact_name": "x-profile-ylslnm-syndication"\n}\n' \
            '${{ github.run_id }}' "${ARTIFACT_ID:-0}" "${ARTIFACT_URL:-}" "$DL_OUTCOME" \
            "${download_rc:-999}" "${media_files:-0}" "${total_bytes:-0}" > x-transfer-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add x-transfer-result.json
          git commit -m 'Record X profile batch transfer metadata' || true
          git push origin HEAD:x-video-transfer-test
