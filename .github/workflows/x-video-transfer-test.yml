name: X profile batch transfer

on:
  push:
    branches:
      - x-video-transfer-test
    paths:
      - .github/workflows/x-video-transfer-test.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out transfer branch
        uses: actions/checkout@v4
        with:
          ref: x-video-transfer-test

      - name: Install gallery-dl
        run: |
          python -m pip install --upgrade pip gallery-dl requests
          gallery-dl --version | tee gallery-dl-version.txt

      - name: Enumerate X embed timeline and download media
        id: download
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rm -rf downloads
          mkdir -p downloads/ylslnm

          cat > enumerate_timeline.py <<'PY'
          import json, random, re, time
          from pathlib import Path
          import requests

          handle = 'ylslnm'
          callback = f'__twttr.callbacks.tl_i0_profile_{handle}_old'
          params = {
              'callback': callback,
              'dnt': 'true',
              'domain': f'embed-{random.randint(100000,999999)}.example.com',
              'lang': 'en',
              'screen_name': handle,
              'suppress_response_codes': 'true',
              't': str(int(time.time())),
              'tz': 'GMT-0100',
              'with_replies': 'false',
          }
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/136.0 Safari/537.36',
              'Accept': '*/*',
              'Referer': 'https://platform.twitter.com/',
          }
          url = 'https://cdn.syndication.twimg.com/timeline/profile'
          r = requests.get(url, params=params, headers=headers, timeout=90)
          Path('old-timeline-status.txt').write_text(
              f'HTTP {r.status_code}\nbytes={len(r.content)}\ncontent_type={r.headers.get("content-type", "")}\nfinal_url={r.url}\n',
              encoding='utf-8')
          Path('old-timeline-response.txt').write_text(r.text, encoding='utf-8', errors='replace')
          r.raise_for_status()
          text = r.text.strip()
          m = re.match(r'^[^(]+\((.*)\)\s*;?\s*$', text, re.S)
          if not m:
              raise RuntimeError('JSONP wrapper not recognized')
          payload = json.loads(m.group(1))
          body = payload.get('body') or ''
          Path('old-timeline-body.html').write_text(body, encoding='utf-8', errors='replace')
          ids = []
          seen = set()
          patterns = [
              rf'/{re.escape(handle)}/status/(\d+)',
              r'data-tweet-id=["\'](\d+)["\']',
              r'data-item-id=["\'](\d+)["\']',
              r'/i/web/status/(\d+)',
          ]
          for pattern in patterns:
              for tid in re.findall(pattern, body, re.I):
                  if tid not in seen:
                      seen.add(tid)
                      ids.append(tid)
          ids = ids[:20]
          Path('status-ids.txt').write_text('\n'.join(ids) + ('\n' if ids else ''), encoding='utf-8')
          summary = {
              'http_status': r.status_code,
              'payload_keys': sorted(payload.keys()),
              'body_bytes': len(body.encode('utf-8')),
              'status_count': len(ids),
              'status_ids': ids,
          }
          Path('old-timeline-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False))
          if not ids:
              raise SystemExit(30)
          PY

          python enumerate_timeline.py > enumerate.log 2>&1
          ENUM_RC=$?

          cat > gallery-dl.conf <<'JSON'
          {
            "extractor": {
              "base-directory": "downloads",
              "twitter": {
                "retweets": false,
                "replies": false,
                "quoted": false,
                "text-tweets": false,
                "videos": true,
                "unavailable": true,
                "tweet-endpoint": "restid",
                "logout": true,
                "ratelimit": "wait:60",
                "sleep-request": "0.8-1.8",
                "filename": "{tweet_id}_{num}.{extension}",
                "directory": ["ylslnm"]
              }
            }
          }
          JSON

          ITEM_FAILURES=0
          : > gallery-dl.log
          if [ "$ENUM_RC" -eq 0 ]; then
            while IFS= read -r ID; do
              [ -n "$ID" ] || continue
              echo "===== $ID =====" >> gallery-dl.log
              gallery-dl --verbose --no-input --config gallery-dl.conf --write-metadata \
                "https://x.com/i/web/status/$ID" >> gallery-dl.log 2>&1
              RC=$?
              if [ "$RC" -ne 0 ]; then
                ITEM_FAILURES=$((ITEM_FAILURES + 1))
              fi
            done < status-ids.txt
          fi

          STATUS_COUNT=$(wc -l < status-ids.txt 2>/dev/null | tr -d ' ')
          STATUS_COUNT=${STATUS_COUNT:-0}
          COUNT=$(find downloads -type f ! -name '*.json' | wc -l | tr -d ' ')
          TOTAL=$(find downloads -type f ! -name '*.json' -printf '%s\n' | awk '{s+=$1} END{print s+0}')
          find downloads -type f -printf '%P\t%s bytes\n' | sort > batch-manifest.txt

          if [ "$ENUM_RC" -ne 0 ]; then
            FINAL_RC=$ENUM_RC
          elif [ "$COUNT" -eq 0 ]; then
            FINAL_RC=31
          else
            FINAL_RC=0
          fi

          echo "enum_rc=$ENUM_RC" >> "$GITHUB_ENV"
          echo "status_count=$STATUS_COUNT" >> "$GITHUB_ENV"
          echo "item_failures=$ITEM_FAILURES" >> "$GITHUB_ENV"
          echo "download_rc=$FINAL_RC" >> "$GITHUB_ENV"
          echo "media_files=$COUNT" >> "$GITHUB_ENV"
          echo "total_bytes=$TOTAL" >> "$GITHUB_ENV"

          cat old-timeline-status.txt 2>/dev/null || true
          cat old-timeline-summary.json 2>/dev/null || true
          tail -n 100 enumerate.log 2>/dev/null || true
          tail -n 160 gallery-dl.log 2>/dev/null || true
          cat batch-manifest.txt 2>/dev/null || true
          exit "$FINAL_RC"

      - name: Upload batch artifact and diagnostics
        id: artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x-profile-ylslnm-cdn-timeline
          path: |
            downloads/
            batch-manifest.txt
            status-ids.txt
            old-timeline-status.txt
            old-timeline-summary.json
            old-timeline-response.txt
            old-timeline-body.html
            enumerate.log
            gallery-dl.log
            gallery-dl-version.txt
            gallery-dl.conf
          if-no-files-found: error
          retention-days: 1

      - name: Publish batch metadata
        if: always()
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          DL_OUTCOME: ${{ steps.download.outcome }}
        run: |
          set -euo pipefail
          printf '{\n  "run_id": %s,\n  "artifact_id": %s,\n  "artifact_url": "%s",\n  "source_profile": "https://x.com/ylslnm",\n  "method": "cdn-syndication-jsonp-plus-restid",\n  "status_count": %s,\n  "item_failures": %s,\n  "download_outcome": "%s",\n  "download_exit_code": %s,\n  "media_files": %s,\n  "total_media_bytes": %s,\n  "artifact_name": "x-profile-ylslnm-cdn-timeline"\n}\n' \
            '${{ github.run_id }}' "${ARTIFACT_ID:-0}" "${ARTIFACT_URL:-}" \
            "${status_count:-0}" "${item_failures:-0}" "$DL_OUTCOME" "${download_rc:-999}" \
            "${media_files:-0}" "${total_bytes:-0}" > x-transfer-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add x-transfer-result.json
          git commit -m 'Record X profile batch transfer metadata' || true
          git push origin HEAD:x-video-transfer-test
