name: X profile batch transfer

on:
  push:
    branches:
      - x-video-transfer-test
    paths:
      - .github/workflows/x-video-transfer-test.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out transfer branch
        uses: actions/checkout@v4
        with:
          ref: x-video-transfer-test

      - name: Install gallery-dl
        run: |
          python -m pip install --upgrade pip gallery-dl
          gallery-dl --version | tee gallery-dl-version.txt

      - name: Download recent X profile media
        id: download
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rm -rf downloads
          mkdir -p downloads
          cat > gallery-dl.conf <<'JSON'
          {
            "extractor": {
              "base-directory": "downloads",
              "twitter": {
                "include": ["media"],
                "retweets": false,
                "replies": false,
                "quoted": false,
                "pinned": false,
                "videos": true,
                "logout": true,
                "ratelimit": "wait:60",
                "sleep-request": "1.0-2.5",
                "filename": "{tweet_id}_{num}.{extension}",
                "directory": ["ylslnm"]
              }
            }
          }
          JSON
          gallery-dl --verbose --no-input --config gallery-dl.conf --post-range 1-20 --write-metadata "https://x.com/ylslnm/media" > gallery-dl.log 2>&1
          RC=$?
          COUNT=$(find downloads -type f ! -name '*.json' | wc -l | tr -d ' ')
          TOTAL=$(find downloads -type f ! -name '*.json' -printf '%s\n' | awk '{s+=$1} END{print s+0}')
          find downloads -type f -printf '%P\t%s bytes\n' | sort > batch-manifest.txt
          echo "download_rc=$RC" >> "$GITHUB_ENV"
          echo "media_files=$COUNT" >> "$GITHUB_ENV"
          echo "total_bytes=$TOTAL" >> "$GITHUB_ENV"
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          echo "media_files=$COUNT" >> "$GITHUB_OUTPUT"
          echo "total_bytes=$TOTAL" >> "$GITHUB_OUTPUT"
          tail -n 120 gallery-dl.log || true
          cat batch-manifest.txt || true
          exit "$RC"

      - name: Upload batch artifact and diagnostics
        id: artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x-profile-ylslnm-latest20
          path: |
            downloads/
            batch-manifest.txt
            gallery-dl.log
            gallery-dl-version.txt
            gallery-dl.conf
          if-no-files-found: error
          retention-days: 1

      - name: Publish batch metadata
        if: always()
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          DL_OUTCOME: ${{ steps.download.outcome }}
        run: |
          set -euo pipefail
          DL_RC="${download_rc:-999}"
          COUNT="${media_files:-0}"
          TOTAL="${total_bytes:-0}"
          printf '{\n  "run_id": %s,\n  "artifact_id": %s,\n  "artifact_url": "%s",\n  "source_profile": "https://x.com/ylslnm",\n  "post_range": "1-20",\n  "download_outcome": "%s",\n  "download_exit_code": %s,\n  "media_files": %s,\n  "total_media_bytes": %s,\n  "artifact_name": "x-profile-ylslnm-latest20"\n}\n' \
            '${{ github.run_id }}' "${ARTIFACT_ID:-0}" "${ARTIFACT_URL:-}" "$DL_OUTCOME" "$DL_RC" "$COUNT" "$TOTAL" > x-transfer-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add x-transfer-result.json
          git commit -m 'Record X profile batch transfer metadata' || true
          git push origin HEAD:x-video-transfer-test
