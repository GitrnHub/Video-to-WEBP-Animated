name: X profile batch transfer

on:
  push:
    branches:
      - x-video-transfer-test
    paths:
      - .github/workflows/x-video-transfer-test.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out transfer branch
        uses: actions/checkout@v4
        with:
          ref: x-video-transfer-test

      - name: Install downloader
        run: |
          python -m pip install --upgrade pip gallery-dl requests
          gallery-dl --version | tee gallery-dl-version.txt

      - name: Enumerate Nitter RSS and download X media
        id: download
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rm -rf downloads nitter-pages
          mkdir -p downloads/ylslnm nitter-pages

          cat > enumerate_nitter.py <<'PY'
          import json, re, sys
          from pathlib import Path
          import requests

          handle='ylslnm'
          candidates=[
            'https://lightbrd.com','https://nitter.space','https://nitter.us.catsarch.com',
            'https://nitter.privacyredirect.com','https://nitter.tiekoetter.com','https://nuku.trabun.org',
            'https://nitter.kareem.one','https://xcancel.com','https://nitter.poast.org','https://nitter.net'
          ]
          paths=[f'/{handle}/rss',f'/{handle}/media',f'/{handle}']
          headers={'User-Agent':'Mozilla/5.0 (compatible; feed-reader/1.0; +https://github.com/)','Accept':'application/rss+xml,application/xml,text/xml,text/html;q=0.8,*/*;q=0.5'}
          s=requests.Session(); s.headers.update(headers)
          ids=[]; seen=set(); attempts=[]; selected=None; file_idx=0
          for base in candidates:
            for path in paths:
              url=base+path
              try:
                r=s.get(url,timeout=25,allow_redirects=True)
                text=r.text
                Path(f'nitter-pages/{file_idx}.txt').write_text(text,encoding='utf-8',errors='replace'); file_idx+=1
                found=re.findall(rf'/{re.escape(handle)}/status/(\d+)',text,re.I)
                found+=re.findall(r'/i/status/(\d+)',text,re.I)
                local=[]; local_seen=set()
                for tid in found:
                  if tid not in local_seen: local_seen.add(tid); local.append(tid)
                title=''
                mt=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
                if mt: title=re.sub(r'\s+',' ',mt.group(1)).strip()[:160]
                attempts.append({'base':base,'path':path,'status':r.status_code,'bytes':len(r.content),'ids':len(local),'content_type':r.headers.get('content-type',''),'title':title,'final_url':r.url})
                if r.status_code==200 and local:
                  selected=url
                  for tid in local:
                    if tid not in seen: seen.add(tid); ids.append(tid)
                    if len(ids)>=20: break
                  if ids: break
              except Exception as e:
                attempts.append({'base':base,'path':path,'error':repr(e)})
            if ids: break
          Path('nitter-attempts.json').write_text(json.dumps({'selected':selected,'attempts':attempts,'ids':ids},ensure_ascii=False,indent=2),encoding='utf-8')
          Path('status-ids.txt').write_text('\n'.join(ids)+('\n' if ids else ''),encoding='utf-8')
          print(json.dumps({'selected':selected,'status_count':len(ids),'attempts':attempts},ensure_ascii=False))
          if not ids: sys.exit(30)
          PY

          python enumerate_nitter.py > enumerate.log 2>&1
          ENUM_RC=$?

          cat > gallery-dl.conf <<'JSON'
          {
            "extractor": {
              "base-directory": "downloads",
              "twitter": {
                "retweets": false,
                "replies": false,
                "quoted": false,
                "text-tweets": false,
                "videos": true,
                "unavailable": true,
                "tweet-endpoint": "restid",
                "logout": true,
                "ratelimit": "wait:60",
                "sleep-request": "0.8-1.8",
                "filename": "{tweet_id}_{num}.{extension}",
                "directory": ["ylslnm"]
              }
            }
          }
          JSON

          ITEM_FAILURES=0
          : > gallery-dl.log
          if [ "$ENUM_RC" -eq 0 ]; then
            while IFS= read -r ID; do
              [ -n "$ID" ] || continue
              echo "===== $ID =====" >> gallery-dl.log
              gallery-dl --verbose --no-input --config gallery-dl.conf --write-metadata "https://x.com/i/web/status/$ID" >> gallery-dl.log 2>&1
              RC=$?; [ "$RC" -eq 0 ] || ITEM_FAILURES=$((ITEM_FAILURES+1))
            done < status-ids.txt
          fi

          STATUS_COUNT=$(wc -l < status-ids.txt 2>/dev/null | tr -d ' '); STATUS_COUNT=${STATUS_COUNT:-0}
          COUNT=$(find downloads -type f ! -name '*.json' | wc -l | tr -d ' ')
          TOTAL=$(find downloads -type f ! -name '*.json' -printf '%s\n' | awk '{s+=$1} END{print s+0}')
          find downloads -type f -printf '%P\t%s bytes\n' | sort > batch-manifest.txt
          if [ "$ENUM_RC" -ne 0 ]; then FINAL_RC=$ENUM_RC; elif [ "$COUNT" -eq 0 ]; then FINAL_RC=31; else FINAL_RC=0; fi
          echo "status_count=$STATUS_COUNT" >> "$GITHUB_ENV"; echo "item_failures=$ITEM_FAILURES" >> "$GITHUB_ENV"
          echo "download_rc=$FINAL_RC" >> "$GITHUB_ENV"; echo "media_files=$COUNT" >> "$GITHUB_ENV"; echo "total_bytes=$TOTAL" >> "$GITHUB_ENV"
          cat nitter-attempts.json 2>/dev/null || true; tail -n 160 gallery-dl.log 2>/dev/null || true; cat batch-manifest.txt 2>/dev/null || true
          exit "$FINAL_RC"

      - name: Upload batch artifact and diagnostics
        id: artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x-profile-ylslnm-rss-index
          path: |
            downloads/
            nitter-pages/
            batch-manifest.txt
            status-ids.txt
            nitter-attempts.json
            enumerate.log
            gallery-dl.log
            gallery-dl-version.txt
            gallery-dl.conf
          if-no-files-found: error
          retention-days: 1

      - name: Publish batch metadata
        if: always()
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          DL_OUTCOME: ${{ steps.download.outcome }}
        run: |
          set -euo pipefail
          printf '{\n  "run_id": %s,\n  "artifact_id": %s,\n  "artifact_url": "%s",\n  "source_profile": "https://x.com/ylslnm",\n  "method": "nitter-rss-index-plus-restid",\n  "status_count": %s,\n  "item_failures": %s,\n  "download_outcome": "%s",\n  "download_exit_code": %s,\n  "media_files": %s,\n  "total_media_bytes": %s,\n  "artifact_name": "x-profile-ylslnm-rss-index"\n}\n' \
            '${{ github.run_id }}' "${ARTIFACT_ID:-0}" "${ARTIFACT_URL:-}" "${status_count:-0}" "${item_failures:-0}" "$DL_OUTCOME" "${download_rc:-999}" "${media_files:-0}" "${total_bytes:-0}" > x-transfer-result.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add x-transfer-result.json; git commit -m 'Record X profile batch transfer metadata' || true; git push origin HEAD:x-video-transfer-test
